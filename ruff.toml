# Lint for real defects only (syntax errors, undefined names, misuse); style is kept consistent by review.
line-length = 140
target-version = "py39"

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B006", "B008"]
ignore = []

[lint.per-file-ignores]
"tests/*" = ["F401"]
"research/*" = ["F401", "F841"]
